[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrac"
version = "0.1.0"
description = "Reconstructive feature discovery for speech and controlled signals"
requires-python = ">=3.11"
dependencies = ["torch>=2.8,<2.9", "numpy>=2,<3", "scipy>=1.13", "soundfile>=0.13", "librosa>=0.11", "scikit-learn>=1.7", "PyYAML>=6", "matplotlib>=3.9", "tensorboard>=2.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]
speech-metrics = ["pesq>=0.0.4", "pystoi>=0.4"]

[project.scripts]
lrac = "lrac.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lrac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "runs/.pytest_cache"
