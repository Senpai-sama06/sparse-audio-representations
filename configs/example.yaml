# Copy this file to start a small experiment. No parent configuration is needed.
# Paths are relative to the project root. Omitted options use config.py defaults.
data:
  source: synthetic
  manifest_dir: data/manifests/example
  sample_rate: 16000
  train_count: 64
  validation_count: 8
  test_count: 8
  synthetic_seconds: 0.25
  crop_seconds: 0.25

model:
  kind: block_orthogonal
  frame_length: 512
  hop: 512
  groups: 4
  initialization: dct
  keep_fraction: 0.125

train:
  name: example
  stage: smoke
  seed: 0
  steps: 20
  batch_size: 4
  val_interval: 10
  val_examples: 4
  log_interval: 10

evaluation:
  analysis_examples: 4
  audio_examples: 2
  bootstrap_samples: 100
